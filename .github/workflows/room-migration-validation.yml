# Room migration validation uses a test-optimized Android image on hosted runners.
name: Full Android verification and Room migrations

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .ci/trigger-full-verification

permissions: {}

concurrency:
  group: room-migration-validation
  cancel-in-progress: false

jobs:
  migration-validation:
    name: Full app tests, lint, APK build and Room migrations
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    permissions: {}
    # Android Emulator 37+ requires explicit opt-in when the runner disables KVM.
    env:
      ANDROID_I_WANT_MY_TCG: "yes"
    steps:
      - name: Verify private source credential is configured
        shell: bash
        env:
          PRIVATE_SOURCE_TOKEN: ${{ secrets.PRIVATE_REPO_READ_TOKEN }}
        run: |
          set +x
          if [ -z "${PRIVATE_SOURCE_TOKEN}" ]; then
            echo "::error::PRIVATE_REPO_READ_TOKEN is missing or unavailable to this workflow."
            exit 1
          fi
          unset PRIVATE_SOURCE_TOKEN
          echo "Private-source credential is present (value intentionally not inspected or printed)."

      - name: Checkout private app with generated schema snapshots
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: zigzag4you/personal-finance-android
          ref: e42a0ffc9b3d1f4808416eef4cd0335d8596b4ec
          token: ${{ secrets.PRIVATE_REPO_READ_TOKEN }}
          path: private-source
          persist-credentials: false
          submodules: false
          lfs: false
          clean: true

      # The public CI runner executes deterministic quality checks against
      # the private checkout; only test output leaves this ephemeral workspace.
      - name: Run Quality Guardian checks
        working-directory: private-source
        shell: bash
        run: |
          set +x
          set -eu
          python3 --version
          python3 -m unittest discover -s scripts -p 'test_*.py' -v

      # Fail fast on the hosted runner before paying the emulator startup cost.
      # These tasks do not require a running Android device.
      - name: Run host-side compile, unit tests, lint and APK preflight
        working-directory: private-source
        shell: bash
        run: |
          set +x
          set -eu
          bash ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:assembleDebugAndroidTest --no-daemon --no-build-cache --stacktrace

      - name: Summarize host-side JUnit failures
        if: always()
        working-directory: private-source
        shell: bash
        run: |
          set +x
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          reports = sorted(Path("app/build/test-results/testDebugUnitTest").glob("TEST-*.xml"))
          if not reports:
              print("No JVM JUnit XML reports were produced.")
              raise SystemExit(0)
          failures = 0
          skipped = 0
          tests = 0
          for report in reports:
              root = ET.parse(report).getroot()
              cases = root.findall(".//testcase")
              tests += len(cases)
              for case in cases:
                  if case.find("skipped") is not None:
                      skipped += 1
                  issue = case.find("failure")
                  if issue is None:
                      issue = case.find("error")
                  if issue is not None:
                      failures += 1
                      message = (issue.attrib.get("message") or "").replace("\\n", " ")
                      detail = (issue.text or "").strip().splitlines()
                      print(f"FAILED {case.attrib.get('classname')}.{case.attrib.get('name')}: {message}")
                      for line in detail[:12]:
                          print(f"  {line[:400]}")
          print(f"JVM_TEST_SUMMARY total={tests} failed={failures} skipped={skipped} passed={tests-failures-skipped}")
          PY

      - name: Summarize host-side lint findings
        if: always()
        working-directory: private-source
        shell: bash
        run: |
          set +x
          python3 - <<'PY'
          from collections import Counter
          from pathlib import Path
          import json

          reports = sorted(Path("app/build/reports").glob("lint-results-*.sarif"))
          if not reports:
              print("No Android Lint SARIF report was produced.")
              raise SystemExit(0)

          totals = Counter()
          for report in reports:
              try:
                  payload = json.loads(report.read_text(encoding="utf-8"))
              except (OSError, json.JSONDecodeError) as exc:
                  print(f"Could not read Lint report {report}: {exc}")
                  continue
              for run in payload.get("runs", []):
                  rules = {
                      rule.get("id"): rule
                      for rule in run.get("tool", {}).get("driver", {}).get("rules", [])
                  }
                  for finding in run.get("results", []):
                      level = finding.get("level", "warning").upper()
                      totals[level] += 1
                      rule_id = finding.get("ruleId", "unknown")
                      message = finding.get("message", {}).get("text", "")
                      location = ""
                      locations = finding.get("locations", [])
                      if locations:
                          physical = locations[0].get("physicalLocation", {})
                          uri = physical.get("artifactLocation", {}).get("uri", "")
                          line = physical.get("region", {}).get("startLine", "?")
                          location = f"{uri}:{line}"
                      print(f"LINT {level} {rule_id} {location}: {message}")
          print("LINT_SUMMARY " + " ".join(f"{key.lower()}={value}" for key, value in sorted(totals.items())))
          PY

      # Boot Google ATD only after all host-side gates pass. This suite needs
      # Android/Room instrumentation, not Play Store or a full interactive phone image.
      - name: Run Android instrumentation on Google ATD
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 35
          target: google_atd
          arch: x86_64
          cores: 2
          ram-size: 2048M
          heap-size: 512M
          emulator-boot-timeout: 1200
          disable-animations: false
          emulator-options: -no-window -gpu off -no-snapshot -noaudio -no-boot-anim
          working-directory: private-source
          script: |
            set +x
            set -eu
            adb devices
            adb -s "$ANDROID_SERIAL" shell getprop ro.build.version.sdk
            bash ./gradlew :app:connectedDebugAndroidTest --no-daemon --no-build-cache --stacktrace --info

      - name: Remove private checkout and source-bearing build state
        if: always()
        shell: bash
        run: |
          set +x
          rm -rf "$GITHUB_WORKSPACE/private-source"
          rm -rf "$HOME/.gradle/caches" "$HOME/.gradle/daemon" "$HOME/.gradle/native" "$HOME/.gradle/notifications" "$HOME/.gradle/wrapper"
