# Room migration validation uses a test-optimized Android image on hosted runners.
name: Full Android verification and Room migrations

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .ci/trigger-full-verification

permissions: {}

concurrency:
  group: room-migration-validation
  cancel-in-progress: false

jobs:
  migration-validation:
    name: Full app tests, lint, APK build and Room migrations
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    permissions: {}
    # Android Emulator 37+ requires explicit opt-in when the runner disables KVM.
    env:
      ANDROID_I_WANT_MY_TCG: "yes"
    steps:
      - name: Verify private source credential is configured
        shell: bash
        env:
          PRIVATE_SOURCE_TOKEN: ${{ secrets.PRIVATE_REPO_READ_TOKEN }}
        run: |
          set +x
          if [ -z "${PRIVATE_SOURCE_TOKEN}" ]; then
            echo "::error::PRIVATE_REPO_READ_TOKEN is missing or unavailable to this workflow."
            exit 1
          fi
          unset PRIVATE_SOURCE_TOKEN
          echo "Private-source credential is present (value intentionally not inspected or printed)."

      - name: Checkout private app with generated schema snapshots
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: zigzag4you/personal-finance-android
          ref: d99abb2c0fb379ddba2494d18e1e799e39743207
          token: ${{ secrets.PRIVATE_REPO_READ_TOKEN }}
          path: private-source
          persist-credentials: false
          submodules: false
          lfs: false
          clean: true

      # The public CI runner executes deterministic quality checks against
      # the private checkout; only test output leaves this ephemeral workspace.
      - name: Run Quality Guardian checks
        working-directory: private-source
        shell: bash
        run: |
          set +x
          set -eu
          python3 --version
          python3 -m unittest discover -s scripts -p 'test_*.py' -v

      # Fail fast on the hosted runner before paying the emulator startup cost.
      # These tasks do not require a running Android device.
      - name: Run host-side compile, unit tests, lint and APK preflight
        working-directory: private-source
        shell: bash
        run: |
          set +x
          set -eu
          bash ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:assembleDebugAndroidTest --no-daemon --no-build-cache --stacktrace

      # Boot Google ATD only after all host-side gates pass. This suite needs
      # Android/Room instrumentation, not Play Store or a full interactive phone image.
      - name: Run Android instrumentation on Google ATD
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 35
          target: google_atd
          arch: x86_64
          cores: 2
          ram-size: 2048M
          heap-size: 512M
          emulator-boot-timeout: 1200
          disable-animations: false
          emulator-options: -no-window -gpu off -no-snapshot -noaudio -no-boot-anim
          working-directory: private-source
          script: |
            set +x
            set -eu
            adb devices
            adb -s "$ANDROID_SERIAL" shell getprop ro.build.version.sdk
            bash ./gradlew :app:connectedDebugAndroidTest --no-daemon --no-build-cache --stacktrace --info

      - name: Remove private checkout and source-bearing build state
        if: always()
        shell: bash
        run: |
          set +x
          rm -rf "$GITHUB_WORKSPACE/private-source"
          rm -rf "$HOME/.gradle/caches" "$HOME/.gradle/daemon" "$HOME/.gradle/native" "$HOME/.gradle/notifications" "$HOME/.gradle/wrapper"
