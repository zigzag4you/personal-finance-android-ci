name: Android emulator health check

on:
  push:
    branches: [main]
    paths:
      - ".ci/emulator-health-check.trigger"

permissions:
  contents: read

concurrency:
  group: android-emulator-health-${{ github.ref }}
  cancel-in-progress: false

jobs:
  emulator-health:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      ANDROID_I_WANT_MY_TCG: yes
    steps:
      - name: Enable KVM group permissions
        shell: bash
        run: |
          set -euo pipefail
          if [ -e /dev/kvm ]; then
            echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
            sudo udevadm control --reload-rules
            sudo udevadm trigger --name-match=kvm
            ls -l /dev/kvm
            if [ -r /dev/kvm ] && [ -w /dev/kvm ]; then
              echo "KVM_READY=true"
            else
              echo "::warning::KVM device exists but is not accessible after applying udev permissions."
            fi
          else
            echo "::warning::No /dev/kvm device on this runner; software emulation fallback will be used."
          fi

      - name: Boot Google ATD and verify Android system services
        timeout-minutes: 20
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          target: google_atd
          arch: x86_64
          cores: 2
          ram-size: 2048M
          heap-size: 512M
          emulator-boot-timeout: 900
          disable-animations: true
          disable-linux-hw-accel: auto
          emulator-options: -no-window -gpu off -no-snapshot -noaudio -no-boot-anim
          script: |
            set -euo pipefail
            adb devices -l
            adb shell getprop ro.build.version.sdk
            echo "PackageManager binder:"
            adb shell service check package
            echo "PackageManager command:"
            adb shell cmd package list packages > /tmp/android-packages.txt
            test -s /tmp/android-packages.txt
            echo "Listed $(wc -l < /tmp/android-packages.txt) packages."
            echo "Memory:"
            adb shell dumpsys meminfo | sed -n '1,70p'
            echo "Data partition:"
            adb shell df -h /data
            echo "Relevant crash/system log:"
            adb logcat -d -b crash -b system -t 2000 2>&1 | grep -Ei 'FATAL EXCEPTION|system_server|PackageManager|OutOfMemory|low memory|lmkd|watchdog|service.*package' | tail -n 120 || true
            echo "ANDROID_EMULATOR_HEALTH=PASS"
